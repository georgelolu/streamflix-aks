name: StreamFlix AKS CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: streamflix-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          kubelogin-version: "v0.2.18"

      - name: Authenticate to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build StreamFlix image
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull \
            -t "$REGISTRY/streamflix:$IMAGE_TAG" \
            ./website

      - name: Push image to ACR
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/streamflix:$IMAGE_TAG"

      - name: Connect to AKS
        env:
          RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
          CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER_NAME" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Verify namespace permissions
        run: |
          set -euo pipefail
          kubectl auth can-i get deployments -n streamflix
          kubectl auth can-i patch deployments -n streamflix
          kubectl auth can-i create services -n streamflix

      - name: Apply StreamFlix service
        run: kubectl apply -f k8s/service.yaml

      - name: Apply deployment with immutable image tag
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          sed -E \
            "s|^([[:space:]]*image: ).*|\1${REGISTRY}/streamflix:${IMAGE_TAG}|" \
            k8s/deployment.yaml |
            kubectl apply -f -

      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/streamflix \
            -n streamflix \
            --timeout=180s
          kubectl get deployment streamflix -n streamflix
          kubectl get pods -n streamflix
